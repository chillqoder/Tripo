<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Living Aquarium</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="loading" role="status" aria-live="polite">
    <div class="load-title">Filling the aquarium…</div>
    <div class="bar"><div class="fill" id="load-fill"></div></div>
    <div class="load-pct" id="load-pct">0%</div>
    <ul id="load-errors"></ul>
  </div>
  <div id="ui" hidden>
    <button id="btn-pause" type="button" aria-label="Pause simulation" title="Pause / resume (space)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path id="ico-pause" d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor"/></svg>
    </button>
    <button id="btn-reset" type="button" aria-label="Reset view" title="Reset view (R)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7l1.9.6A5 5 0 1 0 12 7v3L7.5 6 12 2v3z" fill="currentColor"/></svg>
    </button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
